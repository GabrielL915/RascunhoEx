<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTÓTIPO · Lista de diagramas</title>
<!-- PROTÓTIPO DESCARTÁVEL. Quatro variantes da tela de lista (rota /), trocadas por ?variant=A|B|C|D. Dados falsos, nada persiste. -->
<style>
:root {
  --shadow: oklch(24% 0.011 285);
  --oxblood: oklch(42% 0.161 29);
  --baltic: oklch(46% 0.093 250);
  --ghost: oklch(97.5% 0.009 290);
  --bg: var(--ghost);
  --surface: color-mix(in oklch, var(--ghost), white 60%);
  --ink: var(--shadow);
  --muted: color-mix(in oklch, var(--shadow), var(--ghost) 45%);
  --line: color-mix(in oklch, var(--ghost), var(--shadow) 14%);
  --accent: var(--baltic);
  --accent-ink: var(--ghost);
  --danger: var(--oxblood);
  --radius: 0.625rem;
  --gap: clamp(0.75rem, 0.5rem + 1vw, 1.25rem);
  --fs-title: clamp(1.25rem, 1rem + 1.2vw, 1.75rem);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-block-end: 6rem;
}
h1, h2, h3, p { margin: 0; }
button, input {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  border: 0;
  background: color-mix(in oklch, var(--ink), transparent 92%);
  border-radius: 999px;
  padding-block: 0.5rem;
  padding-inline: 1rem;
  font-weight: 500;
  font-size: 0.875rem;
  line-height: 1.2;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  min-block-size: 2.25rem;
}
button.primary {
  background: var(--accent);
  color: var(--accent-ink);
}
button.ghost { background: transparent; }
button.danger { color: var(--danger); }
button.icon { inline-size: 2.25rem; padding-inline: 0; font-size: 1.1rem; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:active { transform: translateY(1px); }
@media (hover: hover) and (pointer: fine) {
  button:hover { background: color-mix(in oklch, var(--ink), transparent 85%); }
  button.ghost:hover { background: color-mix(in oklch, var(--ink), transparent 92%); }
  button.primary:hover { background: color-mix(in oklch, var(--accent), var(--ink) 12%); }
}
.page {
  --gutter: var(--gap);
  --content: 72rem;
  display: grid;
  grid-template-columns:
    [full-start] minmax(var(--gutter), 1fr)
    [content-start] min(100% - var(--gutter) * 2, var(--content)) [content-end]
    minmax(var(--gutter), 1fr) [full-end];
  row-gap: var(--gap);
  padding-block: var(--gap);
}
.page > * { grid-column: content; }
.thumb {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: calc(var(--radius) - 2px);
  aspect-ratio: 16 / 10;
  overflow: clip;
  display: grid;
  place-items: center;
}
.thumb svg { inline-size: 100%; block-size: 100%; }
.thumb svg path { stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; }
.muted { color: var(--muted); font-size: 0.875rem; }
.row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.push { margin-inline-start: auto; }
.token {
  font-family: ui-monospace, monospace;
  font-size: 0.8rem;
  background: var(--surface);
  border: 1px dashed var(--line);
  border-radius: 999px;
  padding-block: 0.25rem;
  padding-inline: 0.7rem;
}

/* A · Galeria */
.a-head { display: flex; gap: var(--gap); align-items: end; flex-wrap: wrap; }
.a-head h1 { font-size: var(--fs-title); }
.a-grid {
  display: grid;
  gap: var(--gap);
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr));
}
.a-card {
  display: grid;
  grid-row: span 3;
  grid-template-rows: subgrid;
  row-gap: 0.5rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.6rem;
}
.a-card .title { font-weight: 600; }
.a-card .actions { display: flex; gap: 0.25rem; }
.a-card .actions button { min-block-size: 2rem; padding-inline: 0.8rem; }
.a-new {
  border: 2px dashed var(--line);
  background: transparent;
  font-size: inherit;
  font-weight: inherit;
  display: grid;
  place-content: center;
  text-align: center;
  gap: 0.25rem;
  min-block-size: 10rem;
  border-radius: var(--radius);
}

/* B · Explorador */
.b-shell { display: flex; flex-wrap: wrap; gap: var(--gap); align-items: start; }
.b-side {
  flex-basis: 18rem; flex-grow: 1;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  display: grid;
  gap: 0;
}
.b-main { flex-basis: 0; flex-grow: 999; min-inline-size: 55%; display: grid; gap: var(--gap); }
.b-side header { padding: 0.75rem; border-block-end: 1px solid var(--line); display: grid; gap: 0.5rem; }
.b-side h1 { font-size: 1.05rem; }
.b-list { list-style: none; margin: 0; padding: 0; display: grid; }
.b-item {
  display: grid;
  grid-template-columns: 3rem 1fr;
  gap: 0.6rem;
  align-items: center;
  padding: 0.5rem 0.75rem;
  border-block-end: 1px solid var(--line);
  cursor: pointer;
}
.b-item .thumb { aspect-ratio: 1; border-radius: 4px; }
.b-item[aria-current="true"] { background: color-mix(in oklch, var(--accent), var(--surface) 85%); }
@media (hover: hover) and (pointer: fine) { .b-item:hover { background: color-mix(in oklch, var(--surface), var(--ink) 5%); } }
.b-side footer { padding: 0.75rem; display: grid; gap: 0.4rem; }
.b-preview { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--gap); display: grid; gap: var(--gap); }
.b-preview .thumb { aspect-ratio: 16 / 9; }
.b-preview h2 { font-size: var(--fs-title); }
.b-preview input { border: 1px solid transparent; background: transparent; font-size: var(--fs-title); font-weight: 600; inline-size: 100%; border-radius: 6px; padding: 0.2rem 0.4rem; }
.b-preview input:focus-visible { border-color: var(--line); }
.b-link { display: flex; gap: 0.5rem; }
.b-link input { flex: 1; border: 1px solid var(--line); border-radius: var(--radius); padding: 0.5rem 0.7rem; background: var(--bg); font-family: ui-monospace, monospace; font-size: 0.85rem; }

/* C · Fluxo */
.c-drop {
  border: 2px dashed var(--line);
  border-radius: var(--radius);
  padding: clamp(1.5rem, 1rem + 3vw, 3rem);
  display: grid;
  justify-items: center;
  gap: 0.75rem;
  text-align: center;
}
.c-drop h1 { font-size: var(--fs-title); }
.c-table { display: grid; border: 1px solid var(--line); border-radius: var(--radius); overflow: clip; background: var(--surface); }
.c-row {
  display: grid;
  grid-template-columns: 2.5rem 1fr auto;
  gap: 0.75rem;
  align-items: center;
  padding: 0.5rem 0.75rem;
  border-block-end: 1px solid var(--line);
}
.c-row:last-child { border-block-end: 0; }
.c-row .thumb { aspect-ratio: 1; border-radius: 4px; }
.c-row .title { font-weight: 600; }
.c-row .meta { display: flex; gap: 0.75rem; flex-wrap: wrap; }
.c-row .meta code { font-size: 0.8rem; color: var(--muted); }
.c-row .actions { display: flex; gap: 0.25rem; }
.c-row .actions button { min-block-size: 2rem; padding-inline: 0.8rem; }
@media (hover: hover) and (pointer: fine) {
  .c-row .actions { opacity: 0.35; }
  .c-row:hover .actions, .c-row:focus-within .actions { opacity: 1; }
}
.c-foot { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

/* D · YouTube */
.d-top {
  display: flex;
  align-items: center;
  gap: var(--gap);
  flex-wrap: wrap;
  grid-column: full;
  padding-inline: var(--gutter);
}
.d-top .brand { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em; }
.d-search {
  flex: 1 1 18rem;
  display: flex;
  max-inline-size: 36rem;
  margin-inline: auto;
}
.d-search input {
  flex: 1; min-inline-size: 0;
  border: 1px solid var(--line);
  border-radius: 999px 0 0 999px;
  padding: 0.5rem 1rem;
  background: var(--bg);
}
.d-search button { border-radius: 0 999px 999px 0; padding-inline: 1.1rem; font-size: 1.1rem; }
.d-avatar {
  inline-size: 2.1rem; block-size: 2.1rem;
  border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
  font-weight: 700; font-size: 0.85rem;
}
.d-chips {
  display: flex;
  gap: 0.5rem;
  overflow-x: auto;
  scrollbar-width: none;
  padding-block: 0.25rem;
}
.d-chips button { min-block-size: 2rem; padding-inline: 0.8rem; white-space: nowrap; }
.d-chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
.d-grid {
  display: grid;
  gap: 2rem 1rem;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 18rem), 1fr));
}
.d-item { display: grid; gap: 0.6rem; }
.d-item .thumb { aspect-ratio: 16 / 9; border-radius: 0.75rem; border: 0; display: grid; }
.d-item .thumb > * { grid-area: 1 / 1; }
.d-item .thumb .when {
  place-self: end;
  margin: 0.5rem;
  font-size: 0.75rem;
  font-weight: 600;
  background: oklch(15% 0 none / 0.85);
  color: oklch(97% 0 none);
  border-radius: 4px;
  padding: 0.1rem 0.35rem;
}
.d-item .thumb .play {
  place-self: center;
  opacity: 0;
  background: oklch(15% 0 none / 0.75);
  color: oklch(97% 0 none);
  border-radius: 999px;
  padding: 0.4rem 0.9rem;
  font-size: 0.85rem;
}
.d-meta { display: grid; grid-template-columns: 1fr auto; gap: 0.25rem; align-items: start; }
.d-meta .title {
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: clip;
}
.d-meta .kebab { opacity: 0; }
.d-item:focus-within .kebab { opacity: 1; }
@media (hover: hover) and (pointer: fine) {
  .d-item:hover .kebab, .d-item:hover .thumb .play { opacity: 1; }
}
@media (prefers-reduced-motion: no-preference) {
  .d-item .thumb { transition: border-radius 180ms ease-out; }
  @media (hover: hover) and (pointer: fine) { .d-item:hover .thumb { border-radius: 0; } }
}
.d-new { display: contents; }
.d-new .thumb { border: 2px dashed var(--line); background: transparent; place-items: center; color: var(--muted); font-size: inherit; }

/* switcher do protótipo, não faz parte do design */
.proto-bar {
  position: fixed;
  inset-block-end: 1rem;
  inset-inline: 0;
  margin-inline: auto;
  inline-size: fit-content;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: oklch(15% 0 none);
  color: oklch(97% 0 none);
  border-radius: 999px;
  padding: 0.35rem 0.5rem;
  box-shadow: 0 8px 24px oklch(0% 0 none / 0.35);
  font-family: ui-monospace, monospace;
  font-size: 0.85rem;
  z-index: 10;
}
.proto-bar button { background: transparent; border: 0; color: inherit; border-radius: 999px; padding: 0.25rem 0.6rem; }
@media (hover: hover) and (pointer: fine) { .proto-bar button:hover { background: oklch(30% 0 none); } }
.proto-bar .tag { background: oklch(70% 0.2 60); color: oklch(15% 0 none); border-radius: 999px; padding: 0.1rem 0.5rem; font-weight: 700; }
</style>
</head>
<body>
<main id="root" class="page"></main>
<div class="proto-bar">
  <span class="tag">PROTÓTIPO</span>
  <button id="prev" aria-label="anterior">←</button>
  <span id="label"></span>
  <button id="next" aria-label="próxima">→</button>
</div>

<script>
const paths = [
  "M10 40 C30 10, 60 70, 90 30 S150 50, 180 20",
  "M20 20 H120 V70 H20 Z M120 45 L180 45 M150 25 L180 45 L150 65",
  "M30 60 L60 20 L90 60 Z M110 20 h60 v40 h-60 Z M60 60 v15 M140 60 v15",
  "M20 30 Q60 5 100 30 T180 30 M20 60 Q60 35 100 60 T180 60",
  "M40 20 a20 20 0 1 0 0.1 0 M110 20 a20 20 0 1 0 0.1 0 M60 40 H90 M130 40 H170",
  "M20 70 L50 20 L80 50 L110 15 L140 60 L170 30",
];
const diagrams = [
  { id: "k7f2qz", title: "Arquitetura do monorepo", at: "hoje, 14:20", p: 2 },
  { id: "p9a1xd", title: "Fluxo do token de dono", at: "hoje, 09:05", p: 1 },
  { id: "m3c8vt", title: "Schema do banco", at: "ontem", p: 4 },
  { id: "z1w5ne", title: "Sem título", at: "ontem", p: 0 },
  { id: "q6r2lh", title: "Roteamento /d/:id", at: "há 3 dias", p: 3 },
  { id: "b8t4yk", title: "Ideias para o editor", at: "há 1 semana", p: 5 },
];
const token = "ow_7Kq2mX9vL4pZ";
const thumb = d => `<div class="thumb"><svg viewBox="0 0 200 80" preserveAspectRatio="xMidYMid meet"><path d="${paths[d.p]}"/></svg></div>`;
const link = d => `rascunho.app/d/${d.id}`;

const variants = {
  A: { name: "Galeria", render: () => `
    <header class="a-head">
      <div><h1>Meus diagramas</h1><p class="muted">${diagrams.length} diagramas · ordenados por edição</p></div>
      <div class="row push">
        <span class="token" title="seu token de dono">${token}</span>
        <button>Enviar .excalidraw</button>
        <button class="primary">Novo diagrama</button>
      </div>
    </header>
    <section class="a-grid">
      <button class="a-new"><strong>+ Novo diagrama</strong><span class="muted">ou solte um .excalidraw aqui</span></button>
      ${diagrams.map(d => `
        <article class="a-card">
          ${thumb(d)}
          <div><div class="title">${d.title}</div><div class="muted">${d.at}</div></div>
          <div class="actions">
            <button class="primary">Abrir</button>
            <button>Copiar link</button>
            <button class="ghost icon push" aria-label="mais">⋯</button>
          </div>
        </article>`).join("")}
    </section>` },

  B: { name: "Explorador com preview", render: (sel = 0) => `
    <div class="b-shell">
      <aside class="b-side">
        <header>
          <div class="row"><h1>RascunhoEx</h1><button class="primary push">+ Novo</button></div>
          <input placeholder="Buscar…" style="border:1px solid var(--line);border-radius:var(--radius);padding:0.4rem 0.6rem;background:var(--bg)">
        </header>
        <ul class="b-list">
          ${diagrams.map((d, i) => `
            <li class="b-item" data-i="${i}" aria-current="${i === sel}">
              ${thumb(d)}
              <div><div style="font-weight:600">${d.title}</div><div class="muted">${d.at}</div></div>
            </li>`).join("")}
        </ul>
        <footer>
          <span class="muted">Seu token</span>
          <div class="row"><span class="token">${token}</span><button class="ghost">copiar</button></div>
          <button class="ghost" style="justify-self:start">Enviar .excalidraw</button>
        </footer>
      </aside>
      <section class="b-main">
        <div class="b-preview">
          <input value="${diagrams[sel].title}" aria-label="título">
          ${thumb(diagrams[sel])}
          <div class="b-link"><input readonly value="${link(diagrams[sel])}"><button>Copiar link</button></div>
          <div class="row">
            <button class="primary">Abrir no editor</button>
            <span class="muted">editado ${diagrams[sel].at}</span>
            <button class="ghost danger push">Deletar</button>
          </div>
        </div>
      </section>
    </div>` },

  C: { name: "Fluxo: solte, liste, copie", render: () => `
    <section class="c-drop">
      <h1>Solte um .excalidraw aqui</h1>
      <p class="muted">ou</p>
      <div class="row"><button class="primary">Criar diagrama em branco</button><button>Escolher arquivo</button></div>
    </section>
    <section class="c-table">
      ${diagrams.map(d => `
        <div class="c-row">
          ${thumb(d)}
          <div>
            <div class="title">${d.title}</div>
            <div class="meta"><code>${link(d)}</code><span class="muted">${d.at}</span></div>
          </div>
          <div class="actions">
            <button>Copiar link</button>
            <button>Abrir</button>
            <button class="ghost">Renomear</button>
            <button class="ghost danger">Deletar</button>
          </div>
        </div>`).join("")}
    </section>
    <footer class="c-foot muted">
      <span>Seu token: <span class="token">${token}</span></span>
      <button class="ghost">copiar</button>
      <button class="ghost push">Entrar com outro token</button>
    </footer>` },
  D: { name: "YouTube", render: () => `
    <header class="d-top">
      <span class="brand">▶ RascunhoEx</span>
      <form class="d-search" onsubmit="return false"><input placeholder="Buscar nos seus diagramas" aria-label="buscar"><button aria-label="buscar">⌕</button></form>
      <div class="row">
        <button class="primary">＋ Criar</button>
        <span class="d-avatar" title="token ${token}">ow</span>
      </div>
    </header>
    <nav class="d-chips">
      <button aria-pressed="true">Todos</button>
      <button>Recentes</button>
      <button>Sem título</button>
      <button>Enviados</button>
    </nav>
    <section class="d-grid">
      ${diagrams.map(d => `
        <article class="d-item" tabindex="0">
          <div class="thumb">
            <svg viewBox="0 0 200 80" preserveAspectRatio="xMidYMid meet"><path d="${paths[d.p]}"/></svg>
            <span class="play">Abrir</span>
            <span class="when">${d.at}</span>
          </div>
          <div class="d-meta">
            <div>
              <div class="title">${d.title}</div>
              <div class="muted">rascunho.app/d/${d.id}</div>
            </div>
            <button class="ghost icon kebab" aria-label="mais opções">⋮</button>
          </div>
        </article>`).join("")}
      <article class="d-item d-new">
        <button class="thumb"><span>+ Novo diagrama<br><small>ou solte um .excalidraw</small></span></button>
        <div class="d-meta"><div class="muted">Em branco ou enviado do disco</div></div>
      </article>
    </section>` },
};

const keys = Object.keys(variants);
const params = new URLSearchParams(location.search);
let current = keys.includes(params.get("variant")) ? params.get("variant") : "A";
let selected = 0;

function render() {
  const v = variants[current];
  document.getElementById("root").innerHTML = v.render(selected);
  document.getElementById("label").textContent = `${current} (${v.name})`;
  document.title = `PROTÓTIPO · ${current} · ${v.name}`;
  const url = new URL(location); url.searchParams.set("variant", current); history.replaceState(null, "", url);
  document.querySelectorAll(".b-item").forEach(el => el.addEventListener("click", () => { selected = +el.dataset.i; render(); }));
}
function step(n) { current = keys[(keys.indexOf(current) + n + keys.length) % keys.length]; render(); }
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
document.addEventListener("keydown", e => {
  const t = e.target;
  if (t.matches("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
render();
</script>
</body>
</html>
